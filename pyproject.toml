[project]
name = "lucrium-worker"
version = "0.1.0"
description = "Lucrium Worker — демон для Linux VPS: сессии FunPay/PlayerOK/GGsel, host плагинов, WSS для панели"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
authors = [{ name = "nechel12" }]
dependencies = [
    "aiosellers-nechel12==0.3.2",
    "aiosqlite>=0.20",
    "cryptography>=43",
    "jsonschema>=4.23",
    "lucrium-protocol",
    "lucrium-plugin-sdk",
    "websockets>=14",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "types-jsonschema>=4.23",
]

[tool.uv.sources]
lucrium-protocol = { path = "../lucrium-protocol/packages/lucrium-protocol", editable = true }
lucrium-plugin-sdk = { path = "../lucrium-protocol/packages/lucrium-plugin-sdk", editable = true }

[project.scripts]
lucrium-worker = "lucrium_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lucrium_worker"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
# прод — Linux (unix-сокеты плагинов)
platform = "linux"
mypy_path = ["src"]
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
